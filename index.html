/* Global typography: applies to every view, including dynamically created dialogs. */

function rowActionButtons(type,id){return `<span class="row-action-group"><button class="edit-icon-btn" type="button" title="עריכה" aria-label="עריכת סעיף" onclick="event.stopPropagation();openEditor('${type}','${id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button><button class="delete-icon-btn" type="button" title="מחיקה" aria-label="מחיקת סעיף" onclick="event.stopPropagation();requestDelete('${type}','${id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v7m4-7v7"/></svg></button></span>`}
function groupedRow(type,x){return `<tr class="editable-row reorder-row" data-row-id="${esc(x.id)}" tabindex="0" role="button" aria-label="עריכת ${esc(x.name)}" onclick="openEditor('${type}','${x.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openEditor('${type}','${x.id}')}"><td><b>${esc(x.name)}</b>${x.notes?`<div class="mini">${esc(x.notes)}</div>`:''}</td><td>${esc(x.category)}</td><td>${inlineSelect(type,x,"priority",["חובה","רצוי","אופציונלי"])}</td><td>${inlineSelect(type,x,"status",["לבדיקה","אושר","בביצוע","הושלם","בוטל"])}</td>${type==='purchases'?`<td class="quantity-cell"><span class="quantity-inline">${inlineNumber(type,x,"quantity")}<span class="quantity-unit">${esc(x.unit||"יח׳")}</span></span></td>`:''}<td class="money-cell">${x.quantity&&x.unitPrice?money(x.quantity*x.unitPrice):'<span class="unpriced-pill">לא תומחר</span>'}</td><td class="action-col"><div class="row-actions-with-drag">${rowActionButtons(type,x.id)}<button type="button" class="drag-handle" draggable="true" aria-label="שינוי סדר השורה" title="גרירה לשינוי סדר" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></svg></button></div></td></tr>`}
function groupedTable(type,room,items){items=byPriority(items);const purchase=type==='purchases';const total=items.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.unitPrice)||0),0);return `<section class="room-table-section"><div class="room-table-heading"><div class="room-table-title"><span class="room-table-emoji">${rooms.find(r=>r[0]===room)?.[1]||'🏠'}</span><div><h2>${esc(room)}</h2><span>${items.length} ${purchase?'פריטים':'עבודות'}</span></div></div><div class="room-table-actions"><span class="room-table-total">${total?money(total):'<span class="unpriced-pill">טרם תומחר</span>'}</span><button class="room-add-btn" onclick="openEditor('${type}',null,'${esc(room)}')" title="הוספת סעיף לחדר">+ הוספה</button></div></div><div class="tablewrap polished-table room-table-wrap"><table class="data-table ${purchase?'purchase-table':'works-table'}"><colgroup><col style="width:36%"><col style="width:17%"><col style="width:13%"><col style="width:13%">${purchase?'<col style="width:9%">':''}<col style="width:12%"><col style="width:126px"></colgroup><thead><tr><th>סעיף</th><th>קטגוריה</th><th>עדיפות</th><th>סטטוס</th>${purchase?'<th>כמות</th>':''}<th>עלות כוללת</th><th class="action-col" aria-label="עריכה"></th></tr></thead><tbody data-reorder-type="${type}" data-reorder-group="${esc(room)}">${items.map(x=>groupedRow(type,x)).join('')}</tbody></table></div></section>`}

function inlineSelect(type,x,key,options){const tone=key==='priority'?'priority-'+(x[key]||'unknown'):'status-'+(x[key]||'unknown');return `<select class="inline-control inline-${key} ${tone}" aria-label="${key==='priority'?'עדיפות':'סטטוס'}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" onchange="inlineUpdate('${type}','${x.id}','${key}',this.value);this.className='inline-control inline-${key} '+('${key}'==='priority'?'priority-':'status-')+this.value">${options.map(o=>`<option value="${o}" ${x[key]===o?'selected':''}>${o}</option>`).join('')}</select>`}
function inlineNumber(type,x,key){return `<input class="inline-control inline-number" type="number" min="0" step="any" aria-label="כמות" value="${esc(x[key]??'')}" placeholder="—" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" onchange="inlineUpdate('${type}','${x.id}','${key}',this.value)">`}
function inlineUpdate(type,id,key,value){const item=data[type]?.find(x=>x.id===id);if(!item)return;if(key==='quantity'&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0)){alert('יש להזין כמות תקינה');render();return}item[key]=value;save();showToast('השדה עודכן')}
function updateRows(type){let arr=data[type].filter(x=>(filterRoom==='הכל'||x.room===filterRoom)&&(`${x.room} ${x.name} ${x.category} ${x.notes||''}`).toLocaleLowerCase('he').includes(search.toLocaleLowerCase('he'))&&(purchaseStatus==='הכל'||x.status===purchaseStatus)&&(priorityFilter==='הכל'||x.priority===priorityFilter));{const count=$('#workFilterCount');if(count)count.textContent=`מוצגים ${arr.length} מתוך ${data[type].length} סעיפים`;}if(type==='purchases'){let total=arr.reduce((a,x)=>a+(Number(x.quantity)||0)*(Number(x.unitPrice)||0),0),priced=arr.filter(x=>x.quantity&&x.unitPrice).length;const title=$('#purchaseResultsTitle'),count=$('#purchaseResultsCount'),kpis=$('#purchaseKpis');if(title)title.textContent=filterRoom==='הכל'?'כל הרכישות':`רכישות · ${filterRoom}`;if(count)count.textContent=`${arr.length} פריטים`;if(kpis)kpis.innerHTML=`<div class='purchase-kpi'><div class='value'>${arr.length}</div><div class='label'>פריטים בתצוגה</div></div><div class='purchase-kpi'><div class='value'>${priced} / ${arr.length}</div><div class='label'>פריטים מתומחרים</div></div><div class='purchase-kpi'><div class='value'>${money(total)}</div><div class='label'>סכום מתומחר</div></div>`;}const root=$('#groupedTables');if(!root)return;const ordered=[...rooms.map(r=>r[0]),...new Set(arr.map(x=>x.room).filter(r=>!rooms.some(x=>x[0]===r)))];root.innerHTML=[...floors.map(f=>f.name),'אזורים נוספים'].map(floor=>{const matched=ordered.filter(room=>floorOf(room)===floor&&arr.some(x=>x.room===room));if(!matched.length)return '';return `<section class="floor-table-group"><div class="floor-heading"><span class="floor-symbol">${floor==='קומה תחתונה'?'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m-6-6 6 6 6-6"/></svg>':floor==='קומה עליונה'?'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg>':'<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16m-4-4 4 4 4-4M17 20V4m-4 4 4-4 4 4"/></svg>'}</span><div><h2>${floor}</h2><p>${matched.length} חללים · ${matched.reduce((n,r)=>n+arr.filter(x=>x.room===r).length,0)} סעיפים</p></div></div>${matched.map(room=>groupedTable(type,room,arr.filter(x=>x.room===room))).join('')}</section>`}).join('')||`<div class="panel empty">לא נמצאו סעיפים המתאימים לסינון</div>`}

function budget(){let w=sum(data.works),p=sum(data.purchases),base=w+p,res=base*(Number(data.reserve)||0)/100;return header('תקציב השיפוץ','סיכום עלויות לפי הנתונים שתזינו. סכומים חסרים אינם נחשבים כאפס במחיר ההצעה.')+`<div class="stats"><div class="stat"><div class="lbl">עבודות וחומרים</div><div class="num">${money(w)}</div></div><div class="stat"><div class="lbl">רכישות ורהיטים</div><div class="num">${money(p)}</div></div><div class="stat"><div class="lbl">רזרבה (${data.reserve}%)</div><div class="num">${money(res)}</div></div><div class="stat"><div class="lbl">סה״כ מתומחר</div><div class="num">${money(base+res)}</div></div></div><div class="panel"><b>אחוז רזרבה</b><p><input type="number" min="0" max="100" value="${data.reserve}" onchange="data.reserve=Number(this.value);save()" class="reserve-input"> %</p><p class="hint">הסכום הוא חלקי בלבד: כרגע ${[...data.works,...data.purchases].filter(x=>!x.unitPrice||!x.quantity).length} סעיפים עדיין ללא מחיר או כמות. בדקו אם המחירים כוללים מע״מ, הובלה והתקנה. הימנעו מתמחור כפול של מוצר ועבודת התקנה.</p></div>`}
function decisionRoomTabs(){const all=[...new Set(data.decisions.map(x=>x.room))];const ordered=[...rooms.map(x=>x[0]).filter(x=>all.includes(x)),...all.filter(x=>!rooms.some(r=>r[0]===x))];return `<div class="decision-room-tabs" id="decisionRoomTabs"><button class="decision-room-tab ${decisionRoom==='הכל'?'selected':''}" onclick="decisionRoom='הכל';updateDecisionRows()">כל החדרים <span>${data.decisions.length}</span></button>${ordered.map(r=>{const info=rooms.find(x=>x[0]===r);return `<button class="decision-room-tab ${decisionRoom===r?'selected':''}" onclick="decisionRoom='${esc(r)}';updateDecisionRows()"><span class="decision-room-icon">${info?info[1]:'🏠'}</span>${esc(r)} <span>${data.decisions.filter(x=>x.room===r).length}</span></button>`}).join('')}</div>`}
function decisions(){return header('החלטות פתוחות','כל ההחלטות שצריך לסגור כדי להתקדם בשיפוץ — במקום אחד.',`<button class="btn primary" onclick="openEditor('decisions')">+ הוספת החלטה</button>`)+`<div class="decision-stats" id="decisionStats"></div><section class="decision-filter-panel noprint"><div class="decision-filter-heading"><div><strong>לפי חדר או אזור</strong><p>בחרו חדר כדי להתמקד בהחלטות שקשורות אליו</p></div><button class="filter-clear" onclick="decisionRoom='הכל';decisionStatus='הכל';decisionSearch='';render()">ניקוי סינון</button></div>${decisionRoomTabs()}<div class="decision-filter-bottom"><label class="filter-search"><span>⌕</span><input placeholder="חיפוש החלטה או משימה..." value="${esc(decisionSearch)}" oninput="decisionSearch=this.value;updateDecisionRows()"></label><label class="filter-select-wrap"><span>סטטוס</span><select id="decisionStatusSelect" onchange="decisionStatus=this.value;updateDecisionRows()"><option value="הכל">כל הסטטוסים</option>${['פתוח','ממתין','הושלם'].map(v=>`<option value="${v}" ${decisionStatus===v?'selected':''}>${v}</option>`).join('')}</select></label></div></section><div class="decision-results-heading"><div><h2>רשימת החלטות</h2><p id="decisionCount"></p></div></div><div class="tablewrap decision-table-wrap"><table class="decision-table" style="min-width:650px"><thead><tr><th>חדר / אזור</th><th>החלטה / משימה</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody id="decisionRows" data-reorder-type="decisions" data-reorder-group="all"></tbody></table></div>`}
function updateDecisionRows(){const root=$('#decisionRows');if(!root)return;const arr=data.decisions.filter(x=>(decisionRoom==='הכל'||x.room===decisionRoom)&&(decisionStatus==='הכל'||x.status===decisionStatus)&&(`${x.name} ${x.room} ${x.notes||''}`).toLocaleLowerCase('he').includes(decisionSearch.toLocaleLowerCase('he')));const count=$('#decisionCount');if(count)count.textContent=`מוצגות ${arr.length} מתוך ${data.decisions.length} החלטות`;const stats=$('#decisionStats');if(stats){const vals=[['סה״כ החלטות',data.decisions.length,'all'],['פתוחות',data.decisions.filter(x=>x.status==='פתוח').length,'open'],['ממתינות',data.decisions.filter(x=>x.status==='ממתין').length,'waiting'],['הושלמו',data.decisions.filter(x=>x.status==='הושלם').length,'done']];stats.innerHTML=vals.map(v=>`<div class="decision-stat decision-stat-${v[2]}"><span>${v[0]}</span><strong>${v[1]}</strong></div>`).join('')}const tabs=$('#decisionRoomTabs');if(tabs){tabs.querySelectorAll('.decision-room-tab').forEach((b,i)=>{const room=i===0?'הכל':[...rooms.map(x=>x[0]).filter(x=>data.decisions.some(d=>d.room===x)),...new Set(data.decisions.map(x=>x.room).filter(x=>!rooms.some(r=>r[0]===x)))][i-1];b.classList.toggle('selected',decisionRoom===room)})}root.innerHTML=arr.map(x=>`<tr class="editable-row reorder-row" data-row-id="${esc(x.id)}" tabindex="0" role="button" onclick="openEditor('decisions','${x.id}')" onkeydown="if(event.key==='Enter'){openEditor('decisions','${x.id}')}" ><td><span class="decision-room-label"><span>${rooms.find(r=>r[0]===x.room)?.[1]||'🏠'}</span>${esc(x.room)}</span></td><td><div class="decision-name">${esc(x.name)}</div>${x.notes?`<div class="decision-note">${esc(x.notes)}</div>`:''}</td><td>${inlineSelect('decisions',x,'status',['פתוח','ממתין','הושלם'])}</td><td><div class="row-actions-with-drag">${rowActionButtons('decisions',x.id)}<button type="button" class="drag-handle" draggable="true" aria-label="שינוי סדר השורה" title="גרירה לשינוי סדר" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="5" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="19" r="1"/></svg></button></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">אין החלטות שמתאימות לסינון הנוכחי</td></tr>'}

function woodworkPrintView(){
 const items=byPriority(data.works.filter(x=>String(x.category||'').trim()==='נגרות'));
 const grouped=[...new Set(items.map(x=>x.room))];
 const today=new Date().toLocaleDateString('he-IL');
 return `<div class="woodwork-document" dir="rtl">${header('תצוגת נגרות','בית גירשביץ׳ · מסמך לקבלת הצעת מחיר · '+today,`<button class="btn" onclick="go('works')">חזרה לעבודות שיפוץ</button><button class="btn primary" onclick="window.print()">הדפסה / שמירה כ-PDF ↓</button>`)}
 <div class="woodwork-intro"><strong>פירוט עבודות נגרות</strong><p>המסמך כולל את כל העבודות שמסווגות בקטגוריית ״נגרות״, לפי חדר. נא להשלים מידות, חומרים, גוונים, פרזול ומפרט לפני הצעת מחיר סופית. המחירים המוצגים הם הערכות שהוזנו במערכת, אם קיימות.</p><div class="woodwork-count">${items.length} עבודות · ${grouped.length} חדרים</div></div>
 ${grouped.map(room=>`<section class="woodwork-room"><h2>${esc(room)}</h2><table class="woodwork-table"><colgroup><col style="width:7%"><col style="width:39%"><col style="width:12%"><col style="width:25%"><col style="width:17%"></colgroup><thead><tr><th>מס׳</th><th>תיאור העבודה</th><th>עדיפות</th><th>הערות / מפרט</th><th>מחיר מוצע (₪)</th></tr></thead><tbody>${items.filter(x=>x.room===room).map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.name)}</strong></td><td>${esc(x.priority)}</td><td>${esc(x.notes||'—')}</td><td>${x.unitPrice&&x.quantity?money(x.unitPrice*x.quantity):''}</td></tr>`).join('')}</tbody></table></section>`).join('')}
 ${!items.length?'<div class="panel">לא נמצאו עבודות בקטגוריית נגרות.</div>':''}
 <div class="woodwork-footer"><b>הערות להצעת המחיר</b><p>יש לפרט עבור כל סעיף: חומרים, מידות, גימור, פרזול, התקנה, הובלה, מע״מ, אחריות ולוחות זמנים. עבודות נוספות או שינויים יתומחרו בנפרד.</p><div class="woodwork-signature">שם בעל המקצוע: ____________________ &nbsp;&nbsp; תאריך: ______________</div></div></div>`;
}
function contractor(){
const works=byPriority(data.works);
const roomOrder=rooms.map(r=>r[0]);
const floorNames=[...floors.map(f=>f.name),'אזורים נוספים'];
const sections=floorNames.map(floor=>{
 const roomNames=[...new Set(works.filter(x=>floorOf(x.room)===floor).map(x=>x.room))].sort((a,b)=>{
 const ai=roomOrder.indexOf(a),bi=roomOrder.indexOf(b);
 return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'he');
 });
 if(!roomNames.length)return '';
 return `<section class="contractor-floor"><div class="floor-heading"><span class="floor-symbol">${floor==='קומה תחתונה'?'↓':floor==='קומה עליונה'?'↑':'⌂'}</span><div><h2>${esc(floor)}</h2><p>${works.filter(x=>floorOf(x.room)===floor).length} עבודות</p></div></div>
 ${roomNames.map(room=>{
 const items=works.filter(x=>x.room===room);
 return `<section class="contractor-room"><h3>${esc(room)} <span class="contractor-count">· ${items.length} עבודות</span></h3><div class="tablewrap"><table><thead><tr><th>מס׳</th><th>עבודה</th><th>עדיפות</th><th>כמות</th><th>יחידה</th><th>הערות</th><th>מחיר מוצע (₪)</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.name)}</strong></td><td>${esc(x.priority)}</td><td>${esc(x.quantity)}</td><td>${esc(x.unit)}</td><td>${esc(x.notes)}</td><td>${x.unitPrice?money(x.quantity*x.unitPrice):'________'}</td></tr>`).join('')}</tbody></table></div></section>`;
 }).join('')}</section>`;
}).join('');
return header('רשימת עבודות לקבלן','טיוטה להצעת מחיר — יש להשלים כמויות, מפרטים ומידות לפני שליחה.',`<button class="btn" onclick="go('woodwork')">תצוגת נגרות ←</button><button class="btn" onclick="window.print()">הדפסה / שמירה כ-PDF</button>`)+`<div class="panel"><b>הערות לקבלן</b><p class="hint">נא לתמחר כל סעיף בנפרד ולציין במפורש מה כלול: עבודה, חומר, פינוי פסולת, הובלה, התקנה, מע״מ ואחריות. יש לסמן סעיפים שמחייבים בדיקת היתכנות או היתר. עבודות אופציונליות יש לתמחר בנפרד.</p></div><div class="contractor-document">${sections||'<div class="panel">לא נמצאו עבודות.</div>'}</div>`;
}
function showToast(message,error=false){let stack=document.getElementById('toastStack');if(!stack){stack=document.createElement('div');stack.id='toastStack';stack.setAttribute('aria-live','polite');document.body.appendChild(stack)}const el=document.createElement('div');el.className='app-toast'+(error?' error':'');el.textContent=(error?'⚠ ':'✓ ')+message;stack.appendChild(el);setTimeout(()=>{el.remove()},3200)}

async function openBatchUploader(kind='inspo',files){batchFiles=[];document.getElementById('modalRoot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal wide-modal"><h2>הוספת ${kind==='renders'?'הדמיות':'השראות'}</h2><p class="hint">בחרו כמה תמונות ביחד, הגדירו חדר משותף ואפשר גם לערוך הערה לכל תמונה לפני השמירה.</p><label class="field">חדר לכל התמונות<select id="batchRoom">${rooms.map(r=>`<option ${r[0]===selectedRoom?'selected':''}>${esc(r[0])}</option>`).join('')}</select></label><div class="dropzone" id="modalDrop" onclick="document.getElementById('batchPicker').click()" ondragover="dragOverMedia(event)" ondragleave="dragLeaveMedia(event)" ondrop="dropBatch(event)"><strong>גררו לכאן כמה תמונות או לחצו לבחירה</strong><small>עד 8MB לכל תמונה · ניתן להוסיף קבצים בכמה פעמים</small><input type="file" id="batchPicker" multiple accept="image/jpeg,image/png,image/webp" hidden onchange="appendBatchFiles(this.files);this.value=''" /></div><div class="batch-status" id="batchStatus"></div><div class="batch-grid" id="batchGrid"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">ביטול</button><button class="btn primary" id="batchSave" onclick="saveBatch('${kind}')" disabled>שמירת כל התמונות</button></div></div></div>`;if(files?.length)await appendBatchFiles(files)}

let activeReorder=null;
function reorderScope(el){return el.closest('[data-reorder-type]')}
function reorderRow(el){return el.closest('tr.reorder-row')}
function clearReorderUI(){document.querySelectorAll('.reorder-row.dragging,.reorder-row.drop-before,.reorder-row.drop-after').forEach(el=>el.classList.remove('dragging','drop-before','drop-after'));activeReorder=null}
document.addEventListener('dragstart',e=>{
 const handle=e.target.closest?.('.drag-handle');if(!handle)return;
 const row=reorderRow(handle),scope=reorderScope(handle);if(!row||!scope){e.preventDefault();return}
 activeReorder={type:scope.dataset.reorderType,group:scope.dataset.reorderGroup,id:row.dataset.rowId,scope};
 row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',row.dataset.rowId);e.stopPropagation();
});
document.addEventListener('dragover',e=>{
 if(!activeReorder)return;
 const row=reorderRow(e.target),scope=reorderScope(e.target);
 document.querySelectorAll('.reorder-row.drop-before,.reorder-row.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
 if(!row||!scope||scope!==activeReorder.scope||row.dataset.rowId===activeReorder.id){e.dataTransfer.dropEffect='none';return}
 e.preventDefault();e.dataTransfer.dropEffect='move';
 const before=e.clientY<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;
 row.classList.add(before?'drop-before':'drop-after');
});
document.addEventListener('drop',e=>{
 if(!activeReorder)return;
 const target=reorderRow(e.target),scope=reorderScope(e.target),state=activeReorder;
 if(!target||!scope||scope!==state.scope||target.dataset.rowId===state.id){clearReorderUI();return}
 e.preventDefault();e.stopPropagation();
 const before=e.clientY<target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
 const type=state.type,source=data[type],moving=source.find(x=>String(x.id)===state.id),destination=source.find(x=>String(x.id)===target.dataset.rowId);
 if(!moving||!destination||(type!=='decisions'&&moving.room!==destination.room)){clearReorderUI();return}
 // Reorder the complete backing array, even if the view is filtered.
 const without=source.filter(x=>x!==moving),idx=without.indexOf(destination);
 without.splice(idx+(before?0:1),0,moving);data[type]=without;
 clearReorderUI();save();showToast('סדר השורות עודכן');
});
document.addEventListener('dragend',clearReorderUI);

function translateText(text){if(siteLanguage!=='ru')return text;const trimmed=text.trim();if(!trimmed)return text;let out=russianUI[trimmed];if(!out){const m=trimmed.match(/^(\\d+) (עבודות|חדרים|תמונות|רכישות)$/);if(m)out=m[1]+' '+({עבודות:'работ',חדרים:'комнат',תמונות:'изображений',רכישות:'покупок'}[m[2]])}return out?text.replace(trimmed,out):text}
function translateDOM(root){if(siteLanguage!=='ru'||!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement?.closest('script,style,textarea,option[data-user]'))continue;const t=translateText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(e=>{const t=translateText(e.placeholder);if(t!==e.placeholder)e.placeholder=t});root.querySelectorAll('[title],[aria-label]').forEach(e=>{for(const a of ['title','aria-label'])if(e.hasAttribute(a))e.setAttribute(a,translateText(e.getAttribute(a)))})}
function applyLanguage(){document.documentElement.lang=siteLanguage==='ru'?'ru':'he';document.getElementById('siteLang').value=siteLanguage;document.querySelectorAll('.nav .word,.brand-name,.pref-label').forEach(e=>{const original=e.dataset.heOriginal||(e.dataset.heOriginal=e.textContent);e.textContent=siteLanguage==='ru'?(russianUI[original]||original):original});applyTheme();if(siteLanguage==='ru'){translateDOM(document.getElementById('main'));translateDOM(document.getElementById('modalRoot'))}}
function setSiteLanguage(lang){siteLanguage=lang==='ru'?'ru':'he';localStorage.setItem('beitSiteLanguage',siteLanguage);render();applyLanguage()}
document.addEventListener('DOMContentLoaded',()=>{applyTheme();applyLanguage()});
